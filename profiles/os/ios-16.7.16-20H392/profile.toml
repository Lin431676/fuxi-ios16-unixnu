"slide" = "-0x1000000"
# early_security_init is deliberately absent: emit_prelink only patches the AMFI
# initializer when the board supplies its address, and validates that the address sits
# inside original module code. Neither the sheng value (iPadOS 17.7.11) nor the address
# published by Xyvern08371/unixnu-fuxi is valid for this kernelcache, so the prelink
# stopped with "Early security initializer outside original module code".
"roots" = [
  # com.apple.kec.corecrypto is left out: fuxi bootstraps crypto from source
  # (CONFIG_XNU_CRYPTO_BOOTSTRAP="source"), so the kernel already carries
  # corecrypto_kext_start() and its own registration order. Keeping the prelinked Apple
  # kext as well runs a second entropy initialisation whose SHA512_Init calls this
  # kernel's code before g_crypto_funcs is set: a data abort at _SHA512_Init + 0x10,
  # far 0x40.
  "com.apple.AppleFSCompression.AppleFSCompressionTypeZlib",
  "com.apple.driver.AppleARMPlatform",
  "com.apple.driver.AppleARMWatchdogTimer",
  "com.apple.driver.AppleAudioClockLibs",
